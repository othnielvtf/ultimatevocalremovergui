name: Modern model integration

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test worker and controller without model downloads
        run: python -m unittest discover -s tests -v
      - name: Check integration syntax
        run: >-
          python -m py_compile UVR.py modern_models.py gui_data/modern_models_dialog.py
          gui_data/app_paths.py scripts/install_modern.py scripts/build_macos.py
          packaging/macos/bootstrap.py
